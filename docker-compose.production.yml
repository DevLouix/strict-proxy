# =============================================================================
# docker-compose.production.yml — ONE LINUX VPS, WITH THE BUNDLED CADDY EDGE
#
# Starts the controller plus Postgres and Redis, and optionally a Caddy HTTPS
# edge and a local node agent. This is the self-hosted path: you own the server,
# DNS, and TLS certificate.
#
# USE THIS WHEN
#   You have a plain Debian/Ubuntu VPS and are NOT using Dokploy.
#   For Dokploy use docker-compose.dokploy.yml instead — this file publishes
#   host ports and runs its own TLS edge, which conflicts with Dokploy's Traefik.
#
# ENV FILE (required, and it is never auto-loaded)
#   cp .env.docker.example .env.docker   then replace every placeholder.
#   Pass `--env-file .env.docker` on EVERY command; without it Compose reads
#   the local-development .env and fails on the required variables.
#
# RUN
#   # validate the file without starting anything
#   docker compose --env-file .env.docker -f docker-compose.production.yml config
#
#   # core only: controller on 127.0.0.1:8080
#   docker compose --env-file .env.docker -f docker-compose.production.yml up -d --build
#
#   # core + public HTTPS edge (Caddy, ports 80/443, needs DNS)
#   docker compose --profile edge --env-file .env.docker -f docker-compose.production.yml up -d --build
#
#   # core + a node agent on this same host (needs /dev/net/tun and NET_ADMIN)
#   docker compose --profile node --env-file .env.docker -f docker-compose.production.yml up -d --build
#
#   # logs / stop
#   docker compose --env-file .env.docker -f docker-compose.production.yml logs -f controller
#   docker compose --env-file .env.docker -f docker-compose.production.yml down
#
# WHAT IT PUBLISHES
#   controller 127.0.0.1:8080 (plain HTTP), Postgres/Redis on 127.0.0.1, and
#   80/443 only when the `edge` profile is enabled. Keep the database ports on
#   loopback.
#
# PROFILES
#   (default)  controller + postgres + redis
#   edge       + Caddy reverse proxy and certificate management
#   node       + node-agent on this host; for a multi-VPS fleet run one node per
#                VPS instead, with its own enrollment token
#
# STEP BY STEP: SETUP.md section 4.  FILE MAP: docs/FILE-MAP.md
# =============================================================================

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    hostname: ${POSTGRES_HOSTNAME:-strict-proxy-postgres}
    restart: ${POSTGRES_RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-strict_proxy}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: ${POSTGRES_HEALTH_INTERVAL:-5s}
      timeout: ${POSTGRES_HEALTH_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTH_RETRIES:-20}
      start_period: ${POSTGRES_HEALTH_START_PERIOD:-10s}
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    logging:
      driver: ${DOCKER_LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    networks: [backend]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    hostname: ${REDIS_HOSTNAME:-strict-proxy-redis}
    restart: ${REDIS_RESTART_POLICY:-unless-stopped}
    command: ["redis-server", "--appendonly", "${REDIS_APPENDONLY:-yes}", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: ${REDIS_HEALTH_INTERVAL:-5s}
      timeout: ${REDIS_HEALTH_TIMEOUT:-3s}
      retries: ${REDIS_HEALTH_RETRIES:-20}
      start_period: ${REDIS_HEALTH_START_PERIOD:-5s}
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
    logging:
      driver: ${DOCKER_LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    networks: [backend]

  controller:
    image: ${CONTROLLER_IMAGE:-strict-proxy/controller:local}
    hostname: ${CONTROLLER_HOSTNAME:-strict-proxy-controller}
    build:
      context: ${BUILD_CONTEXT:-.}
      dockerfile: ${CONTROLLER_DOCKERFILE:-docker/controller.Dockerfile}
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    restart: ${CONTROLLER_RESTART_POLICY:-unless-stopped}
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${CONTROLLER_INTERNAL_PORT:-8080}
      DATABASE_URL: ${CONTROLLER_DATABASE_URL:?CONTROLLER_DATABASE_URL is required}
      REDIS_URL: ${CONTROLLER_REDIS_URL:?CONTROLLER_REDIS_URL is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-strict-proxy-controller}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SIGNING_PRIVATE_KEY_PEM: ${SIGNING_PRIVATE_KEY_PEM:?SIGNING_PRIVATE_KEY_PEM is required}
      SIGNING_KEY_ID: ${SIGNING_KEY_ID:-primary}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}
      HEARTBEAT_TTL_SECONDS: ${HEARTBEAT_TTL_SECONDS:-90}
      HMAC_TIMESTAMP_TOLERANCE_SECONDS: ${HMAC_TIMESTAMP_TOLERANCE_SECONDS:-300}
      DEFAULT_REALITY_SERVER_NAME: ${DEFAULT_REALITY_SERVER_NAME:-www.microsoft.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      NODE_IP_AUTODETECT: ${NODE_IP_AUTODETECT:-true}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-31536000}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      OPENPAY_API_KEY: ${OPENPAY_API_KEY:-}
      OPENPAY_BASE_URL: ${OPENPAY_BASE_URL:-https://api.openpay.example.com}
      OPENPAY_WEBHOOK_SECRET: ${OPENPAY_WEBHOOK_SECRET:-}
      OPENPAY_SIGNATURE_HEADER: ${OPENPAY_SIGNATURE_HEADER:-x-webhook-signature-v1}
      OPENPAY_TIMESTAMP_TOLERANCE_SECONDS: ${OPENPAY_TIMESTAMP_TOLERANCE_SECONDS:-300}
      OPENPAY_PLATFORM_NAME: ${OPENPAY_PLATFORM_NAME:-StrictProxy}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-USD}
      STANDARD_TIER_AMOUNT_MINOR: ${STANDARD_TIER_AMOUNT_MINOR:-200}
      PRO_TIER_AMOUNT_MINOR: ${PRO_TIER_AMOUNT_MINOR:-1000}
      # In-app updates: version/build/notes of the APK at CLIENT_ANDROID_APK_PATH.
      # Unset values mean the app is offered no update. Mount the APK into the
      # container and point this at the in-container path.
      CLIENT_ANDROID_VERSION: ${CLIENT_ANDROID_VERSION:-}
      CLIENT_ANDROID_BUILD_NUMBER: ${CLIENT_ANDROID_BUILD_NUMBER:-0}
      CLIENT_ANDROID_APK_PATH: ${CLIENT_ANDROID_APK_PATH:-}
      CLIENT_ANDROID_NOTES: ${CLIENT_ANDROID_NOTES:-}
      # Builds uploaded from the admin dashboard live here. It must be on a
      # volume, or a redeploy would delete the APK users are being offered.
      CLIENT_ANDROID_STORAGE_DIR: ${CLIENT_ANDROID_STORAGE_DIR:-/var/lib/strict-proxy/client-releases}
      # Both are documented in .env.docker.example and both were previously
      # never forwarded into the container: settings secrets silently fell back
      # to a key derived from JWT_SECRET, and outbound mail linked to
      # http://localhost:3000 instead of the real deployment.
      # Required, and validated at boot: a localhost value is refused in
      # production, because reset and receipt links would then be unusable.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required — the public URL users reach}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      DB_INIT_MAX_ATTEMPTS: ${DB_INIT_MAX_ATTEMPTS:-30}
    ports:
      - "${CONTROLLER_BIND_ADDRESS:-127.0.0.1}:${CONTROLLER_PORT:-8080}:${CONTROLLER_INTERNAL_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - clientreleases:/var/lib/strict-proxy/client-releases
    dns:
      - ${CONTAINER_DNS_PRIMARY:-1.1.1.1}
      - ${CONTAINER_DNS_SECONDARY:-8.8.8.8}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: ${CONTROLLER_HEALTH_INTERVAL:-10s}
      timeout: ${CONTROLLER_HEALTH_TIMEOUT:-5s}
      retries: ${CONTROLLER_HEALTH_RETRIES:-12}
      start_period: ${CONTROLLER_HEALTH_START_PERIOD:-20s}
    deploy:
      resources:
        limits:
          memory: ${CONTROLLER_MEMORY_LIMIT:-512m}
          cpus: ${CONTROLLER_CPU_LIMIT:-1}
    logging:
      driver: ${DOCKER_LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    networks:
      backend:
        aliases:
          - ${CONTROLLER_INTERNAL_ALIAS:-strict-proxy-controller}

  edge:
    profiles: [edge]
    image: ${EDGE_IMAGE:-caddy:2.11.4-alpine}
    hostname: ${EDGE_HOSTNAME:-strict-proxy-edge}
    restart: ${EDGE_RESTART_POLICY:-unless-stopped}
    init: true
    environment:
      TLS_MODE: ${TLS_MODE:-disabled}
      TLS_EMAIL: ${TLS_EMAIL:-ops@example.com}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
      CADDY_CONTROLLER_HOST: ${CADDY_CONTROLLER_HOST:-controller}
      CONTROLLER_INTERNAL_PORT: ${CONTROLLER_INTERNAL_PORT:-8080}
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - caddyconfig:/etc/caddy
      - caddydata:/data
      - caddystate:/config
    entrypoint: ["/usr/local/bin/strict-proxy-edge-entrypoint"]
    command: []
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
      - source: edge_entrypoint
        target: /usr/local/bin/strict-proxy-edge-entrypoint
        mode: 0555
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz"]
      interval: ${EDGE_HEALTH_INTERVAL:-10s}
      timeout: ${EDGE_HEALTH_TIMEOUT:-5s}
      retries: ${EDGE_HEALTH_RETRIES:-12}
      start_period: ${EDGE_HEALTH_START_PERIOD:-10s}
    deploy:
      resources:
        limits:
          memory: ${EDGE_MEMORY_LIMIT:-128m}
    logging:
      driver: ${DOCKER_LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    networks: [backend]

  # Optional single-node Docker deployment. For a multi-VPS fleet, run this
  # image independently on each VPS with its own enrollment token.
  node-agent:
    profiles: [node]
    image: ${NODE_AGENT_IMAGE:-strict-proxy/node-agent:local}
    hostname: ${NODE_AGENT_HOSTNAME:-strict-proxy-node-agent}
    build:
      context: ${BUILD_CONTEXT:-.}
      dockerfile: ${NODE_AGENT_DOCKERFILE:-docker/node-agent.Dockerfile}
      args:
        SING_BOX_VERSION: ${SING_BOX_VERSION:-1.14.4}
        NODE_VERSION: ${NODE_VERSION:-22}
    restart: ${NODE_AGENT_RESTART_POLICY:-unless-stopped}
    init: true
    network_mode: ${NODE_NETWORK_MODE:-host}
    # No NET_ADMIN and no /dev/net/tun: the rendered sing-box config is a
    # VLESS+REALITY inbound with a `direct` outbound, so the agent never opens a
    # TUN device. Host networking is all it needs.
    environment:
      CONTROLLER_URL: ${NODE_CONTROLLER_URL:-http://127.0.0.1:8080}
      NODE_ENROLLMENT_TOKEN: ${NODE_ENROLLMENT_TOKEN:-}
      # Empty means "detect the public IP and report it to the controller".
      NODE_PUBLIC_IP: ${NODE_PUBLIC_IP:-}
      NODE_PUBLIC_IP_ECHO_URL: ${NODE_PUBLIC_IP_ECHO_URL:-https://api.ipify.org}
      NODE_TUNNEL_PORT: ${NODE_TUNNEL_PORT:-443}
      NODE_HOSTNAME: ${NODE_HOSTNAME:-strict-proxy-node-agent}
      NODE_LABEL: ${NODE_LABEL:-}
      NODE_REALITY_SERVER_NAME: ${NODE_REALITY_SERVER_NAME:-www.microsoft.com}
      NODE_IDENTITY_PATH: ${NODE_IDENTITY_PATH:-/var/lib/strict-proxy/node-identity.json}
      SING_BOX_BINARY: ${SING_BOX_BINARY:-/usr/local/bin/sing-box}
      SING_BOX_RESTART_MODE: managed
      SING_BOX_CONFIG_PATH: ${SING_BOX_CONFIG_PATH:-/etc/sing-box/config.json}
      SING_BOX_STATS_API_LISTEN: ${SING_BOX_STATS_API_LISTEN:-127.0.0.1:10085}
      SING_BOX_STATS_PROTO: ${SING_BOX_STATS_PROTO:-/app/apps/node-agent/src/v2rayapi/stats.proto}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-30}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      USAGE_INTERVAL_SECONDS: ${USAGE_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - nodeidentity:/var/lib/strict-proxy
    healthcheck:
      # The agent touches /tmp/agent-healthy on every heartbeat, so a stopped
      # loop is reported unhealthy instead of looking alive through tini.
      test:
        - CMD
        - node
        - -e
        - "const fs=require('fs');try{process.exit(Date.now()-fs.statSync('/tmp/agent-healthy').mtimeMs<180000?0:1)}catch{process.exit(1)}"
      interval: ${NODE_AGENT_HEALTH_INTERVAL:-30s}
      timeout: ${NODE_AGENT_HEALTH_TIMEOUT:-5s}
      retries: ${NODE_AGENT_HEALTH_RETRIES:-3}
      start_period: ${NODE_AGENT_HEALTH_START_PERIOD:-15s}
    deploy:
      resources:
        limits:
          memory: ${NODE_AGENT_MEMORY_LIMIT:-512m}
          cpus: ${NODE_AGENT_CPU_LIMIT:-2}
    logging:
      driver: ${DOCKER_LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}

volumes:
  pgdata:
    name: ${POSTGRES_DATA_VOLUME:-strict-proxy-pgdata}
  redisdata:
    name: ${REDIS_DATA_VOLUME:-strict-proxy-redisdata}
  nodeidentity:
    name: ${NODE_IDENTITY_VOLUME:-strict-proxy-nodeidentity}
  clientreleases:
    name: ${CLIENT_RELEASES_VOLUME:-strict-proxy-client-releases}
  caddyconfig:
    name: ${EDGE_CONFIG_VOLUME:-strict-proxy-caddyconfig}
  caddydata:
    name: ${EDGE_DATA_VOLUME:-strict-proxy-caddydata}
  caddystate:
    name: ${EDGE_STATE_VOLUME:-strict-proxy-caddystate}

configs:
  caddyfile:
    file: ./docker/Caddyfile
  edge_entrypoint:
    file: ./docker/edge-entrypoint.sh

networks:
  backend:
    driver: ${BACKEND_NETWORK_DRIVER:-bridge}
    ipam:
      driver: ${BACKEND_NETWORK_IPAM_DRIVER:-default}
      config:
        - subnet: ${BACKEND_NETWORK_SUBNET:-172.30.0.0/16}
          gateway: ${BACKEND_NETWORK_GATEWAY:-172.30.0.1}
