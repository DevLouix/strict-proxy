[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strict-proxy-gatekeeper"
version = "0.1.1"
description = "Official StrictProxy Gatekeeper SDK — protect websites and APIs so only users routed through your StrictProxy fleet (and optional plan tier) can access them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  {name = "StrictProxy Contributors"},
]
keywords = [
  "strict-proxy",
  "gatekeeper",
  "proxy-auth",
  "vpn",
  "ed25519",
  "access-control",
  "fastapi",
  "flask",
  "django",
  "asgi",
  "wsgi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
  "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/DevLouix/strict-proxy"
Repository = "https://github.com/DevLouix/strict-proxy"
Documentation = "https://github.com/DevLouix/strict-proxy/tree/main/sdks/python#readme"
Issues = "https://github.com/DevLouix/strict-proxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strict_proxy_gatekeeper = ["py.typed"]
