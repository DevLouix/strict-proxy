# =============================================================================
# docker-compose.live-test.yml — SANDBOX NETWORKING OVERRIDE. NEVER PRODUCTION.
#
# This is an OVERRIDE file, not a stack. Layer it on top of
# docker-compose.production.yml to move every container to host networking on
# alternate ports. It exists because some restricted Docker sandboxes block
# container-to-container TCP, which prevents the normal stack from starting.
#
# USE THIS WHEN
#   You are reproducing a deployment inside such a sandbox or CI runner. It is
#   not part of any documented deployment path and no production service should
#   ever be started with it.
#
# WHAT IT CHANGES
#   postgres  -> host networking, 127.0.0.1:${POSTGRES_LIVE_PORT:-15432}
#   redis     -> host networking, 127.0.0.1:${REDIS_LIVE_PORT:-16379}
#   controller-> host networking, ${CONTROLLER_LIVE_PORT:-18080}
#   edge      -> host networking, http://127.0.0.1:18081, TLS disabled
#   all       -> published ports and the backend network are removed
#
# RUN (both -f flags, production file first)
#   docker compose --env-file .env.docker \
#     -f docker-compose.production.yml -f docker-compose.live-test.yml config
#   docker compose --env-file .env.docker \
#     -f docker-compose.production.yml -f docker-compose.live-test.yml up -d
#
# REQUIREMENTS
#   Docker Compose >= 2.24 for `!reset`, and a Linux host that allows host
#   networking. This removes network isolation by design, so do not expose the
#   resulting ports to the internet.
# ============================================================================
services:
  postgres:
    network_mode: host
    networks: !reset []
    ports: !reset []
    command: ["postgres", "-p", "${POSTGRES_LIVE_PORT:-15432}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${POSTGRES_LIVE_PORT:-15432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  redis:
    network_mode: host
    networks: !reset []
    ports: !reset []
    command: ["redis-server", "--port", "${REDIS_LIVE_PORT:-16379}", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p ${REDIS_LIVE_PORT:-16379} -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
  controller:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      PORT: ${CONTROLLER_LIVE_PORT:-18080}
      DATABASE_URL: ${CONTROLLER_DATABASE_LIVE_URL:-postgres://live:live-postgres-password-2026@127.0.0.1:15432/strict_proxy_live}
      REDIS_URL: ${CONTROLLER_REDIS_LIVE_URL:-redis://:live-redis-password-2026@127.0.0.1:16379}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 18080) + '/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  edge:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      TLS_MODE: disabled
      CADDY_SITE_ADDRESS: http://127.0.0.1:18081
      CADDY_CONTROLLER_HOST: 127.0.0.1
      CONTROLLER_INTERNAL_PORT: 18080
    command: []
  node-agent:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      NODE_CONTROLLER_URL: ${NODE_CONTROLLER_LIVE_URL:-http://127.0.0.1:18080}
      SING_BOX_RESTART_MODE: managed

networks: {}
