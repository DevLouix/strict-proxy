# =============================================================================
# docker-compose.dokploy-node.yml — ONE EXIT NODE, DEPLOYED PER VPS (DOKPLOY)
#
# Runs a single node agent with host networking so sing-box can accept
# VLESS+REALITY on NODE_TUNNEL_PORT, and users' traffic egresses from that VPS's
# public IP.
#
# USE THIS WHEN
#   Adding an exit node to a Dokploy deployment. Create a SEPARATE Dokploy
#   Compose service for it on the exit VPS. This file is not part of, and must
#   not be merged into, docker-compose.dokploy.yml: the controller does not need
#   host networking, and nodes should not share the controller's IP or failure
#   domain.
#
# IMAGE
#   Pulled from the GitHub Container Registry; nothing is built on the VPS:
#     ghcr.io/<owner>/strict-proxy-node-agent:latest
#   .github/workflows/node-agent.yml publishes :sha-<commit>, :main and :latest
#   for linux/amd64 and linux/arm64 on every push that touches the agent. Pin
#   NODE_AGENT_TAG=sha-<commit> on a node so an upgrade is deliberate; leave it
#   unset to track latest. Override NODE_AGENT_REGISTRY_OWNER for a fork. If the
#   package is private, run `docker login ghcr.io` on the VPS first.
#
# ENV FILE
#   Paste the NODE section of .env.dokploy.example into this service's
#   Environment tab in Dokploy. The file is a worksheet; Dokploy reads the UI.
#
# REQUIRED ON FIRST BOOT
#   NODE_CONTROLLER_URL    https://api.example.com  the controller's public URL
#   NODE_ENROLLMENT_TOKEN  one-time token from Admin -> Enrollments
#   NODE_HOSTNAME          this VPS's public DNS name or IP
#   NODE_PUBLIC_IP         optional; leave empty to auto-detect and self-heal
#
# AFTER ENROLLMENT
#   The one-time token is spent. Remove NODE_ENROLLMENT_TOKEN and redeploy. The
#   permanent identity (node id, HMAC secret, REALITY keypair) lives in the
#   `nodeidentity` volume, not in the environment. NODE_ID and NODE_HMAC_SECRET
#   are override slots rather than settings: leave them empty, and set them only
#   when the controller's secret was rotated and the agent's 401 names them.
#
# WHAT IT PUBLISHES
#   Host networking: TCP and UDP on NODE_TUNNEL_PORT (default 443). Open both on
#   the VPS firewall. If that port is already held on the host (nginx, Caddy,
#   Traefik), the managed agent falls back at startup to the first free port in
#   443, 8443, 2053, 2083, 2087, 2096, 8880, 9443, 10443 and logs it; open the
#   port it reports on both protocols. The stats listener stays on
#   127.0.0.1:10085.
#
# DO NOT
#   - add a Dokploy domain: this is not an HTTP app;
#   - run two nodes on one host (one identity and one IP per node);
#   - expose the stats listener.
#
# REQUIREMENTS
#   A public IPv4 and inbound TCP+UDP on the tunnel port. No /dev/net/tun and no
#   NET_ADMIN: the node is a userspace VLESS+REALITY proxy with a `direct`
#   outbound, so it never opens a TUN device and needs no extra capability.
#
# STEP BY STEP: docs/DOKPLOY.md section 5.  FILE MAP: docs/FILE-MAP.md
# =============================================================================

services:
  node-agent:
    image: ghcr.io/${NODE_AGENT_REGISTRY_OWNER:-devlouix}/strict-proxy-node-agent:${NODE_AGENT_TAG:-latest}
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      CONTROLLER_URL: ${NODE_CONTROLLER_URL:?NODE_CONTROLLER_URL is required — the controller's public https URL}
      NODE_ENROLLMENT_TOKEN: ${NODE_ENROLLMENT_TOKEN:-}
      # Empty means "use the identity in the nodeidentity volume", which is what
      # enrolled the node. Set these only to override it, e.g. after a rotation.
      NODE_ID: ${NODE_ID:-}
      NODE_HMAC_SECRET: ${NODE_HMAC_SECRET:-}
      NODE_PUBLIC_IP: ${NODE_PUBLIC_IP:-}
      NODE_PUBLIC_IP_ECHO_URL: ${NODE_PUBLIC_IP_ECHO_URL:-https://api.ipify.org}
      NODE_PUBLIC_IP_DETECT_INTERVAL_SECONDS: ${NODE_PUBLIC_IP_DETECT_INTERVAL_SECONDS:-600}
      NODE_TUNNEL_PORT: ${NODE_TUNNEL_PORT:-443}
      NODE_HOSTNAME: ${NODE_HOSTNAME:?NODE_HOSTNAME is required — this VPS's public hostname}
      NODE_LABEL: ${NODE_LABEL:-}
      NODE_REALITY_SERVER_NAME: ${NODE_REALITY_SERVER_NAME:-www.microsoft.com}
      NODE_IDENTITY_PATH: /var/lib/strict-proxy/node-identity.json
      SING_BOX_BINARY: /usr/local/bin/sing-box
      SING_BOX_RESTART_MODE: managed
      SING_BOX_CONFIG_PATH: /etc/sing-box/config.json
      SING_BOX_STATS_API_LISTEN: 127.0.0.1:10085
      SING_BOX_STATS_PROTO: /app/apps/node-agent/src/v2rayapi/stats.proto
      # Keep this at 50 or below. Log lines only leave on a heartbeat, and the
      # console's Logs button waits 55s for the reply that asks for them, so a
      # longer interval makes that button time out on every click.
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-30}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      USAGE_INTERVAL_SECONDS: ${USAGE_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The healthcheck below reads this same variable, so the two cannot drift.
      AGENT_HEALTH_PATH: /tmp/agent-healthy
    volumes:
      - nodeidentity:/var/lib/strict-proxy
    healthcheck:
      # `kill -0 1` only proved tini was alive, so a dead agent loop still looked
      # healthy. The agent touches this file on every heartbeat instead.
      test:
        - CMD
        - node
        - -e
        - "const fs=require('fs'),p=process.env.AGENT_HEALTH_PATH||'/tmp/agent-healthy';try{process.exit(Date.now()-fs.statSync(p).mtimeMs<180000?0:1)}catch{process.exit(1)}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  nodeidentity:
    name: ${NODE_IDENTITY_VOLUME:-strict-proxy-nodeidentity}
