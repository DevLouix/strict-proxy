name: node-agent

# Publishes the exit-node image that docker-compose.dokploy-node.yml runs:
#   ghcr.io/<owner>/strict-proxy-node-agent:latest
# A green run means the image was built for both VPS architectures and that the
# published digest actually boots: sing-box runs, the entrypoint refuses a first
# start without an enrollment token, and the agent's sources and proto are in
# the image. When the repository variable NODE_CONTROLLER_URL is set, the smoke
# job also proves the container can reach the controller it will enroll with.
#
# There is deliberately no enrollment-token secret: tokens are single-use and
# expire, so a repository secret would be stale by the next run. The token
# belongs in each node service's environment (docs/DOKPLOY.md §5).
#
# This workflow is the only publisher of the node image. server-ci deliberately
# does not build it: a second, single-platform push of the same sha tag replaced
# the multi-arch index with an amd64-only one and raced on `latest`.

on:
  pull_request:
    paths: &node_paths
      - 'apps/node-agent/**'
      - 'packages/types/**'
      - 'docker/node-agent.Dockerfile'
      - 'docker/node-agent-entrypoint.sh'
      - 'docker-compose.dokploy-node.yml'
      - '.github/workflows/node-agent.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths: *node_paths
  # Publish without a commit, e.g. after bumping SING_BOX_VERSION:
  #   gh workflow run node-agent -f tag=0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (e.g. 0.1.0); empty publishes sha and branch tags only'
        required: false
        default: ''
        type: string
      sing_box_version:
        description: 'sing-box version to bake in; empty uses the SING_BOX_VERSION variable, else 1.14.4'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: node-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  # Point these at a mirror with repository variables if GHCR is not the
  # registry your VPSes can reach; custom registries also need the two
  # NODE_AGENT_REGISTRY_* secrets (the configuration gate names them).
  REGISTRY: ${{ vars.NODE_AGENT_REGISTRY || 'ghcr.io' }}
  IMAGE_OWNER: ${{ vars.NODE_AGENT_REGISTRY_OWNER || github.repository_owner }}
  IMAGE_NAME: strict-proxy-node-agent
  SING_BOX_VERSION: ${{ github.event.inputs.sing_box_version || vars.SING_BOX_VERSION || '1.14.4' }}

jobs:
  verify:
    name: Verify node agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Typecheck the node agent
        run: npm run typecheck -w apps/node-agent

      - name: Check the entrypoint parses
        run: bash -n docker/node-agent-entrypoint.sh

      # The published image is only useful if the file that pulls it parses, so
      # validate the node stack with throwaway values on every change.
      - name: Validate the node Compose file
        env:
          NODE_CONTROLLER_URL: https://controller.example.invalid
          NODE_HOSTNAME: ci-node
        run: docker compose -f docker-compose.dokploy-node.yml config >/dev/null

      # Same shape as the client's release gate: fail with the exact missing
      # values instead of publishing an image nothing can pull.
      - name: Require node release configuration
        if: github.event_name != 'pull_request'
        env:
          NODE_CONTROLLER_URL: ${{ vars.NODE_CONTROLLER_URL }}
          REGISTRY_USERNAME: ${{ secrets.NODE_AGENT_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.NODE_AGENT_REGISTRY_PASSWORD }}
        run: |
          missing=()
          if [ -n "${NODE_CONTROLLER_URL:-}" ]; then
            case "$NODE_CONTROLLER_URL" in
              https://*) ;;
              *)
                echo "error: NODE_CONTROLLER_URL must use https://; got: $NODE_CONTROLLER_URL" >&2
                exit 1
                ;;
            esac
          fi
          if [ "$REGISTRY" != "ghcr.io" ]; then
            [ -n "${REGISTRY_USERNAME:-}" ] || missing+=("secret NODE_AGENT_REGISTRY_USERNAME")
            [ -n "${REGISTRY_PASSWORD:-}" ] || missing+=("secret NODE_AGENT_REGISTRY_PASSWORD")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'error: publishing to %s needs credentials that are not set.\nmissing:\n' "$REGISTRY" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [ -z "${NODE_CONTROLLER_URL:-}" ]; then
            echo "::warning::NODE_CONTROLLER_URL is not set, so the published image is not checked against a live controller. Enable it with: gh variable set NODE_CONTROLLER_URL --body 'https://your-controller'"
          fi

  image:
    name: Build and publish the node image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      repository: ${{ steps.resolve.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      # Docker references are lowercase; github.repository_owner is "DevLouix".
      # metadata-action lowercases what it pushes, so everything downstream has
      # to agree on the lowercased name.
      - name: Resolve the image repository
        id: resolve
        run: |
          owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # Exit VPSes are a mix of amd64 and arm64; publishing both means a node
      # never runs under emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'ghcr.io' && github.actor || secrets.NODE_AGENT_REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.NODE_AGENT_REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.resolve.outputs.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/node-agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node-agent
          cache-to: type=gha,mode=max,scope=node-agent

      # The VPS only needs the image reference and digest; publishing them as an
      # artifact is what an operator copies into the node service.
      - name: Record the image reference as an artifact
        run: |
          mkdir -p dist
          file="dist/node-agent-image-${GITHUB_SHA}.txt"
          {
            echo "repository=${{ steps.resolve.outputs.repository }}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "sing_box_version=${SING_BOX_VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "pull=${{ steps.resolve.outputs.repository }}@${{ steps.build.outputs.digest }}"
          } > "$file"
          cat "$file"

      # The image is already published; this file only saves an operator a
      # lookup. Exhausted artifact quota must not fail the release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: node-agent-image-${{ github.sha }}
          path: dist/node-agent-image-${{ github.sha }}.txt
          if-no-files-found: error

      - name: Record the published digest
        run: |
          {
            echo "### node-agent image"
            echo
            echo "- image: \`${{ steps.resolve.outputs.repository }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- sing-box: \`${{ env.SING_BOX_VERSION }}\`"
            echo "- pin it with \`NODE_AGENT_TAG=sha-<commit>\` on the node VPS"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Verify the published image
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      REPO: ${{ needs.image.outputs.repository }}
      IMAGE_REF: ${{ needs.image.outputs.repository }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: docker/setup-qemu-action@v3

      # A GHCR package pushed by GITHUB_TOKEN starts private, so the smoke job
      # authenticates even though a public package would not need it.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'ghcr.io' && github.actor || secrets.NODE_AGENT_REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.NODE_AGENT_REGISTRY_PASSWORD }}

      # Test the exact digest that was pushed, not a local rebuild.
      - name: Pull the published digest
        run: docker pull "$IMAGE_REF"

      - name: sing-box runs on both architectures
        run: |
          # Run the tag, not the index digest: Docker refuses to pull a second
          # platform under the same digest reference ("cannot overwrite digest").
          tag_ref="${REPO}:sha-${GITHUB_SHA:0:7}"
          for platform in linux/amd64 linux/arm64; do
            version="$(docker run --rm --platform "$platform" --entrypoint /usr/local/bin/sing-box "$tag_ref" version | head -1)"
            echo "$platform: $version"
            grep -Fq "version ${SING_BOX_VERSION}" <<<"$version" \
              || { echo "error: expected sing-box ${SING_BOX_VERSION}, got: $version" >&2; exit 1; }
          done

      - name: A first start without an enrollment token is refused
        run: |
          set +e
          output="$(docker run --rm -e NODE_HOSTNAME=ci-node -e CONTROLLER_URL=https://controller.example.invalid "$IMAGE_REF" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -q 'NODE_ENROLLMENT_TOKEN is required on first node startup' <<<"$output"

      - name: The agent sources and proto are inside the image
        run: |
          docker run --rm --entrypoint node "$IMAGE_REF" -e "
            const fs = require('node:fs');
            for (const p of ['/app/apps/node-agent/src/agent.ts', '/app/apps/node-agent/src/v2rayapi/stats.proto', '/app/node_modules', '/usr/local/bin/sing-box']) {
              if (!fs.existsSync(p)) { console.error('missing in image:', p); process.exit(1); }
            }
          "

      # A package pushed by GITHUB_TOKEN starts private, and a fresh exit VPS has
      # no credentials. Visibility is a repository setting this workflow cannot
      # change, so report it in the summary instead of failing the publish.
      - name: The package is pullable without credentials
        if: env.REGISTRY == 'ghcr.io'
        run: |
          docker logout "$REGISTRY" >/dev/null 2>&1 || true
          if docker manifest inspect "${REPO}:latest" >/dev/null 2>&1; then
            echo "::notice::${REPO} is public; a fresh VPS can pull it without docker login"
            echo 'Package visibility: public' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::${REPO} is private, so a fresh exit VPS cannot pull it"
            {
              echo '### Package visibility: private'
              echo
              echo 'A fresh exit VPS needs one of:'
              echo
              echo '- make the package public: GitHub -> your packages -> `strict-proxy-node-agent` -> Package settings -> Change visibility -> Public (nothing to do per VPS);'
              echo '- or log in on each VPS with a token that has `read:packages`: `echo $PAT | docker login ghcr.io -u <owner> --password-stdin`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Proves the container can actually reach the controller: DNS, egress and
      # the CA bundle are the three things that fail after an image is built.
      - name: The image reaches the controller
        if: vars.NODE_CONTROLLER_URL != ''
        env:
          NODE_CONTROLLER_URL: ${{ vars.NODE_CONTROLLER_URL }}
        run: |
          docker run --rm --entrypoint node -e NODE_CONTROLLER_URL "$IMAGE_REF" -e '
            fetch(process.env.NODE_CONTROLLER_URL + "/healthz")
              .then((r) => { console.log("healthz", r.status); if (!r.ok) process.exit(1); })
              .catch((e) => { console.error(e.message); process.exit(1); });
          '
