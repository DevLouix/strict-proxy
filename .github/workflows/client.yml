name: client

on:
  pull_request:
    paths:
      - 'apps/client/**'
      - '.github/workflows/client.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'apps/client/**'
      - '.github/workflows/client.yml'
  # Build on demand without an empty commit, e.g. right after setting the
  # release secrets: `gh workflow run client`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `stable`. A new Flutter stable release began marking
  # `package:flutter/material.dart` deprecated in every file, which failed
  # `flutter analyze` on code no one had touched. Every other build input here
  # (Go, the NDK, the engine SHA) is pinned for the same reason: a release must
  # not change because upstream shipped.
  #
  # Upgrading is deliberate: bump this, then migrate the `material.dart` imports
  # the new analyzer points at.
  FLUTTER_VERSION: '3.47.9'
  CLIENT_ENV: production
  # Set the repository variable CLIENT_CONTROLLER_URL once the controller has a
  # real HTTPS address; the placeholder keeps compile-only builds working.
  CLIENT_CONTROLLER_URL: ${{ vars.CLIENT_CONTROLLER_URL || 'https://controller.example.invalid' }}

jobs:
  verify:
    name: Test and analyze client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check release scripts parse
        working-directory: apps/client
        run: |
          bash -n \
            tool/build-release-android.sh \
            tool/build-libbox.sh \
            tool/configure-android-host.sh \
            tool/sign-android-apk.sh \
            tool/unpack-libbox-aar.sh \
            tool/verify-android-apk.sh \
            tool/setup-release-secrets.sh \
            tool/check-release-config.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # flutter-action caches the SDK, not the packages: without this every run
      # re-downloads the dependency graph before the first test starts.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/client/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # This job only creates host projects and runs Dart tests/analysis; it
      # does not compile a Linux or Android target. The runner already has the
      # tools Flutter needs, and apt here has repeatedly hung before any build
      # step ran.
      - name: Generate Flutter host projects
        working-directory: apps/client
        run: |
          flutter create --platforms=linux,android .
          ./tool/configure-android-host.sh

      - name: Get dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Check optional native libbox artifact
        working-directory: apps/client
        run: ./tool/check-android-libbox.sh

      - name: Run Flutter tests
        working-directory: apps/client
        run: flutter test

      - name: Analyze Flutter sources
        working-directory: apps/client
        run: flutter analyze

  libbox:
    name: Build libbox native engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The sing-box tree, the Go module cache and the finished AAR are keyed to
      # the pinned commit *and* the engine build recipe, so an unrelated client
      # change rebuilds neither the clone nor the native library — but a changed
      # ABI list or build flag can no longer reuse a stale AAR.
      - name: Restore libbox build cache
        uses: actions/cache@v4
        id: libbox-cache
        with:
          path: |
            ~/go/pkg/mod
            apps/client/.cache/sing-box-libbox
            apps/client/packages/libbox_bridge/android/libs/libbox.aar
          key: libbox-${{ hashFiles('apps/client/libbox.ref', 'apps/client/tool/build-libbox.sh') }}

      # Restore first and trust the file, not the cache-hit flag: a restore can
      # place the AAR while reporting no hit. Everything below it is skipped on a
      # warm cache, which used to cost the Go setup and the NDK download before a
      # single useful step ran.
      - name: Check for the native engine
        id: engine
        run: |
          if [ -f apps/client/packages/libbox_bridge/android/libs/libbox.aar ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'libbox.aar is present; skipping the engine toolchain and build'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.engine.outputs.present != 'true'
        with:
          # libbox is pinned to sing-box v1.14.4, the same engine the node image
          # bakes in; its go.mod requires Go 1.25.5 and the sagernet/gomobile pin.
          go-version: '1.25.5'
          cache: false

      # sing-box 1.14 links libcronet.a, whose objects use TLS-descriptor
      # relocations that the runner's preinstalled NDK 27 lld rejects with
      # "unknown relocation (315)". 28.0.13004108 is the NDK the upstream
      # Android client builds this engine with. This is the slowest setup step
      # here, so it only runs when the engine actually has to build.
      - name: Install the Android NDK and free runner disk
        if: steps.engine.outputs.present != 'true'
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # Four-ABI gomobile builds fill the runner's free space (the engine now
          # also compiles tailscale and cronet), so drop what this job never uses
          # before installing the NDK it needs.
          sudo rm -rf "$SDK/ndk/27.3.13750724" "$SDK/system-images" "$SDK/emulator" \
            /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          MANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$MANAGER" "ndk;28.0.13004108" >/dev/null 2>&1 || true
          test -d "$SDK/ndk/28.0.13004108"
          df -h /
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build libbox.aar for the published Android ABIs
        if: steps.engine.outputs.present != 'true'
        env:
          # Only the ARM ABIs are published, so binding x86/x86_64 for emulators
          # would double the cgo work in this build for APKs the release never
          # ships. A local build still binds all four by default.
          LIBBOX_ANDROID_PLATFORMS: android/arm64,android/arm
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./apps/client/tool/build-libbox.sh --android-only

      - name: Verify libbox.aar
        run: |
          AAR=apps/client/packages/libbox_bridge/android/libs/libbox.aar
          test -f "$AAR" || { echo "libbox.aar was not produced" >&2; exit 1; }
          ls -l "$AAR"

      # The AAR is handed to the Android job through the actions cache, not an
      # uploaded artifact: it is a multi-hundred-megabyte build input, and the
      # artifact store's quota is shared with the APKs users download.

  ios-verification:
    name: Verify the iOS client builds
    needs: verify
    # GitHub only provisions macOS runners on plans that include them. Without
    # one, the job fails before any step runs ("configuration ... is not
    # supported") and the whole run is reported as cancelled, hiding real
    # failures. Opt in with the repository variable ENABLE_IOS_VERIFICATION=true.
    if: vars.ENABLE_IOS_VERIFICATION == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # iOS could not be verified locally: it needs macOS and Xcode. This closes
      # that gap for every push, so a change that breaks the iOS build is caught
      # by CI rather than at release time.
      #
      # `--no-codesign` deliberately: this proves the Dart and native code
      # compile for iOS. Signing is a release step needing an Apple team
      # identity and provisioning profiles, which cannot live in CI.
      - name: Generate iOS host project and build
        working-directory: apps/client
        run: |
          flutter create --platforms=ios .
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=STRICT_ENV=${CLIENT_ENV} \
            --dart-define=STRICT_CONTROLLER_URL=${CLIENT_CONTROLLER_URL}

      # A build that compiles is not the same as a client that works: assert the
      # native engine bridge and the signing-key configuration actually landed,
      # the way the Linux and Android artifacts are checked.
      - name: Verify the built iOS app
        working-directory: apps/client
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then echo "no .app produced" >&2; exit 1; fi
          echo "built: $APP"
          test -f "$APP/Frameworks/App.framework/App" \
            || { echo "App.framework missing — the Dart entrypoint did not link" >&2; exit 1; }

  linux-artifact:
    name: Build Linux client artifact
    needs: verify
    # PRs only verify; a push or a manual dispatch publishes a release, so a
    # re-run after changing the release secrets actually produces an APK.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Release assets use release storage, not the Actions artifact quota.
    permissions:
      contents: write
    steps:
      # Full history: the release notes diff this build against the previous
      # client tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The runner's mirrorlist prefers azure.archive.ubuntu.com, which has
      # throttled this job to ~15 kB/s and turned a 28 MB install into a
      # 30-minute stall. The public archive also serves noble-security, so pin
      # every Ubuntu source to it instead of retrying the throttled host.
      - name: Use the public Ubuntu archive
        run: |
          MIRRORS=/etc/apt/apt-mirrors.txt
          if [ -f "$MIRRORS" ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee "$MIRRORS" >/dev/null
          fi
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$file" ] || continue
            sudo sed -i -E \
              -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              -e 's#https?://security\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              "$file"
          done

      - name: Install Linux build dependencies
        timeout-minutes: 15
        # libsecret-1-dev is required by flutter_secure_storage_linux's CMake
        # check (libsecret-1>=0.18.4); without it the Linux build fails while
        # configuration runs, before any Dart code is compiled.
        run: |
          APT_OPTIONS=(-o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get update "${APT_OPTIONS[@]}"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${APT_OPTIONS[@]}" \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Verify the controller URL answers
        if: vars.CLIENT_CONTROLLER_URL != ''
        env:
          CLIENT_CONTROLLER_URL: ${{ vars.CLIENT_CONTROLLER_URL }}
        run: |
          url="${CLIENT_CONTROLLER_URL%/}/healthz"
          # One probe turned a momentary blip into a failed release build. The
          # controller has no cold start, so a short retry window distinguishes
          # "down" from "one request lost" without hiding a real outage.
          code=""
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$url" || true)"
            [ "$code" = "200" ] && break
            echo "attempt ${attempt}: ${code:-no response}; retrying"
            sleep $((attempt * 5))
          done
          if [ "$code" != "200" ]; then
            printf 'error: %s answered %s, not 200\n' "$url" "${code:-no response}" >&2
            exit 1
          fi

      - name: Generate host project and build
        working-directory: apps/client
        run: |
          flutter create --platforms=linux .
          flutter pub get
          flutter build linux --release \
            --dart-define=STRICT_ENV=${CLIENT_ENV} \
            --dart-define=STRICT_CONTROLLER_URL=${CLIENT_CONTROLLER_URL}
      - name: Archive Linux client
        run: tar -czf strict-proxy-client-linux-${GITHUB_SHA}.tar.gz -C apps/client/build/linux/x64/release/bundle .
      # The artifact store fills up and then refuses every upload, which used
      # to fail the run after a good build. A release asset is the durable copy
      # anyway, so publish there and skip the artifact entirely.
      # Each release states what changed, so two builds can be told apart without
      # diffing the repository. The range starts at the previous client tag, which
      # is the same build number the in-app updater tracks.
      - name: Collect changes since the previous client release
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --force --quiet || true
          prev="$(git tag --list 'client-*' --sort=-creatordate | head -1)"
          {
            echo '### Changes in this build'
            echo
            if [ -n "$prev" ]; then
              lines="$(git log --no-merges --pretty='- %s (`%h`)' "$prev"..HEAD -- apps/client .github/workflows/client.yml | head -40)"
              if [ -n "$lines" ]; then printf '%s\n' "$lines"; else echo "- No client changes since \`$prev\`."; fi
            else
              echo '- First published client build.'
            fi
          } > "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md"

      - name: Attach the Linux bundle to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ vars.CLIENT_CONTROLLER_URL }}
          TAG: client-${{ github.run_number }}
        run: |
          notes="$(mktemp)"
          {
            echo "Signed Android APK and Linux bundle built from \`${GITHUB_SHA}\`."
            echo
            echo "- controller: \`${URL}\`"
            echo "- version: \`0.1.0\`, build ${GITHUB_RUN_NUMBER}"
            echo "- installs over an earlier build only if it was signed with the same release keystore"
            echo "- one APK per ABI: pick \`arm64-v8a\` for a modern phone, \`armeabi-v7a\` for an older one (emulator ABIs are not published)"
            echo
            echo "Install: \`adb install -r strict-proxy-client-android-${GITHUB_SHA}-arm64-v8a.apk\`"
            echo
            if [ -f "$RUNNER_TEMP/changes.md" ]; then cat "$RUNNER_TEMP/changes.md"; fi
            echo
            echo "Built by [\`client\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > "$notes"
          # The Android job races us to the same tag; a lost create is fine as
          # long as the release exists before the upload.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "StrictProxy client 0.1.0 (build ${GITHUB_RUN_NUMBER})" \
              --notes-file "$notes" || true
          fi
          gh release upload "$TAG" "strict-proxy-client-linux-${GITHUB_SHA}.tar.gz" --clobber
          gh release view "$TAG" --json tagName,assets \
            --jq '.tagName + ": " + ([.assets[].name] | join(", "))'

  android-artifact:
    name: Build Android client artifact
    needs:
      - verify
      - libbox
    # PRs only verify; a push or a manual dispatch publishes a release, so a
    # re-run after changing the release secrets actually produces an APK.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Present only when the repository has release signing configured; the
      # build steps below pick the strongest artifact those values allow.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CLIENT_SIGNING_PUBLIC_KEY: ${{ vars.CLIENT_SIGNING_PUBLIC_KEY }}
    steps:
      # Full history: the release notes diff this build against the previous
      # client tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The artifact is a signed release build or nothing: an unsigned APK
      # installs but could never be updated with the real key. Fail with the
      # exact missing values instead of publishing one.
      - name: Require release configuration
        env:
          CLIENT_CONTROLLER_URL: ${{ vars.CLIENT_CONTROLLER_URL }}
          CLIENT_SIGNING_PUBLIC_KEY: ${{ vars.CLIENT_SIGNING_PUBLIC_KEY }}
        run: ./apps/client/tool/check-release-config.sh

      # CLIENT_CONTROLLER_URL is compiled into the APK, so a host that does not
      # answer produces an app nobody can sign in to. Check it before the
      # 15-25 minute native build rather than shipping an APK pointed at a dead
      # or half-routed domain.
      - name: Verify the controller URL answers
        env:
          CLIENT_CONTROLLER_URL: ${{ vars.CLIENT_CONTROLLER_URL }}
        run: |
          url="${CLIENT_CONTROLLER_URL%/}/healthz"
          # Retry briefly: a single lost request should not fail an APK build
          # that has already passed its signing checks.
          code=""
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$url" || true)"
            [ "$code" = "200" ] && break
            echo "attempt ${attempt}: ${code:-no response}; retrying"
            sleep $((attempt * 5))
          done
          if [ "$code" != "200" ]; then
            printf 'error: %s answered %s, not 200.\n' "$url" "${code:-no response}" >&2
            echo 'The APK bakes this URL in, so it would not be able to log in.' >&2
            echo 'Fix the deployment (Dokploy -> controller -> Domains, internal port 8080, HTTPS on),' >&2
            echo 'or set CLIENT_CONTROLLER_URL to a host that serves the controller, then re-run.' >&2
            exit 1
          fi
          echo "controller reachable: $url -> 200"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # zip is preinstalled on the runner. Avoid apt-get update here too: the
      # signing script only needs zip, and a stalled mirror must not block an
      # APK that has already passed its release-configuration checks.
      - name: Check APK signing tools
        run: command -v zip

      # Flutter, Gradle, the libbox JNI libraries and the signing copy together
      # exceed the runner's free space. Neither the emulator images nor the
      # .NET/CodeQL toolchains are used by this job.
      - name: Free runner disk
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sudo rm -rf "$SDK/system-images" "$SDK/emulator" \
            /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Gradle and the pub cache are the second-largest cost after the engine
      # build, and were re-downloaded from scratch (AGP, Kotlin, R8) every run.
      - name: Cache Gradle and pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/client/pubspec.yaml', 'apps/client/tool/configure-android-host.sh') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Same key the libbox job caches under, so the engine is reused instead of
      # rebuilt. A cold cache rebuilds it here rather than failing the APK.
      - name: Restore the native engine
        id: libbox-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/client/packages/libbox_bridge/android/libs/libbox.aar
          key: libbox-${{ hashFiles('apps/client/libbox.ref', 'apps/client/tool/build-libbox.sh') }}

      # Trust the file, not the cache-hit flag: a restore can place the AAR
      # while reporting no hit, and rebuilding it then is pure waste.
      - name: Check for the native engine
        id: engine
        run: |
          if [ -f apps/client/packages/libbox_bridge/android/libs/libbox.aar ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'libbox.aar is present; skipping the engine build'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Android NDK for a libbox rebuild
        if: steps.engine.outputs.present != 'true'
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$MANAGER" "ndk;28.0.13004108" >/dev/null 2>&1 || true
          test -d "$SDK/ndk/28.0.13004108"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        if: steps.engine.outputs.present != 'true'
        with:
          go-version: '1.25.5'
          cache: false

      - name: Rebuild libbox when the engine is absent
        if: steps.engine.outputs.present != 'true'
        env:
          # Matches the libbox job, so a cold rebuild produces the same AAR.
          LIBBOX_ANDROID_PLATFORMS: android/arm64,android/arm
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./apps/client/tool/build-libbox.sh --android-only

      # A cold engine build leaves the sing-box checkout, the Go module cache
      # and several GB of Go build cache behind. Gradle then needs the same disk
      # for three APKs, the signing copies and its own intermediates, and the
      # runner dies mid-build when it runs out. Keep the AAR; drop the rest.
      #
      # `go clean`, not `rm -rf`: the module cache is deliberately read-only, so
      # rm fails with EACCES halfway through and takes the job down with it.
      - name: Reclaim the engine build space
        if: steps.engine.outputs.present != 'true'
        run: |
          go clean -modcache || true
          go clean -cache || true
          rm -rf apps/client/.cache/sing-box-libbox "$HOME/go/bin"
          df -h /

      # AGP cannot package a local .aar inside the library module, so the AAR is
      # expanded into classes.jar + jni/<abi>/libbox.so before Gradle runs.
      - name: Unpack libbox for the Gradle plugin
        run: ./apps/client/tool/unpack-libbox-aar.sh

      - name: Generate host project with the deployment identity
        working-directory: apps/client
        run: |
          flutter create --platforms=android .
          ./tool/configure-android-host.sh
          flutter pub get

      - name: Decode the release keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          STRICT_CONTROLLER_URL: ${{ vars.CLIENT_CONTROLLER_URL }}
          STRICT_SIGNING_PUBLIC_KEY: ${{ vars.CLIENT_SIGNING_PUBLIC_KEY }}
          APP_VERSION: '0.1.0'
          APP_BUILD_NUMBER: ${{ github.run_number }}
          SKIP_LIBBOX: '1'
          # x86_64 is emulator-only and is not published, so building and
          # signing it was a third of the packaging phase for nothing.
          TARGET_PLATFORMS: android-arm,android-arm64
        run: ./apps/client/tool/build-release-android.sh

      # The build is split per ABI, so there is one APK per architecture; each
      # is verified and renamed with its ABI so a user knows which to install.
      - name: Collect and verify the APKs
        run: |
          mkdir -p dist-android
          shopt -s nullglob
          apks=(apps/client/build/dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo 'the build produced no APK' >&2
            exit 1
          fi

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"

          for apk in "${apks[@]}"; do
            base="$(basename "$apk" .apk)"          # strict-proxy-0.1.0-19-arm64-v8a
            rest="${base#strict-proxy-}"
            abi="${rest#*-}"
            abi="${abi#*-}"
            out="dist-android/strict-proxy-client-android-${GITHUB_SHA}-${abi:-universal}.apk"
            cp "$apk" "$out"
            ls -l "$out"
            ./apps/client/tool/verify-android-apk.sh "$out"
            "$APKSIGNER" verify --print-certs "$out" \
              | grep -E 'certificate DN|SHA-256 digest' | head -2
          done

      # Same changelog as the Linux job: the Android job may be the one that
      # creates the tag, and the notes must be complete either way.
      - name: Collect changes since the previous client release
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --force --quiet || true
          prev="$(git tag --list 'client-*' --sort=-creatordate | head -1)"
          {
            echo '### Changes in this build'
            echo
            if [ -n "$prev" ]; then
              lines="$(git log --no-merges --pretty='- %s (`%h`)' "$prev"..HEAD -- apps/client .github/workflows/client.yml | head -40)"
              if [ -n "$lines" ]; then printf '%s\n' "$lines"; else echo "- No client changes since \`$prev\`."; fi
            else
              echo '- First published client build.'
            fi
          } > "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md"

      - name: Attach the APKs to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ vars.CLIENT_CONTROLLER_URL }}
          TAG: client-${{ github.run_number }}
        run: |
          notes="$(mktemp)"
          {
            echo "Signed Android APK and Linux bundle built from \`${GITHUB_SHA}\`."
            echo
            echo "- controller: \`${URL}\`"
            echo "- version: \`0.1.0\`, build ${GITHUB_RUN_NUMBER}"
            echo "- installs over an earlier build only if it was signed with the same release keystore"
            echo "- one APK per ABI: pick \`arm64-v8a\` for a modern phone, \`armeabi-v7a\` for an older one (emulator ABIs are not published)"
            echo
            echo "Install: \`adb install -r strict-proxy-client-android-${GITHUB_SHA}-arm64-v8a.apk\`"
            echo
            if [ -f "$RUNNER_TEMP/changes.md" ]; then cat "$RUNNER_TEMP/changes.md"; fi
            echo
            echo "Built by [\`client\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > "$notes"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "StrictProxy client 0.1.0 (build ${GITHUB_RUN_NUMBER})" \
              --notes-file "$notes" || true
          fi
          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "$TAG" dist-android/*.apk --clobber; then
              uploaded=true
              break
            fi
            echo "upload attempt ${attempt} failed; retrying"
            sleep 5
          done
          [ "$uploaded" = true ] || { echo 'could not attach the APKs to the release' >&2; exit 1; }
          gh release view "$TAG" --json tagName,assets \
            --jq '.tagName + ": " + ([.assets[].name] | join(", "))'


