name: client-release

# Builds the APK you give to users: production defines, the controller's
# Ed25519 public key, the native libbox engine, and a real release signature.
# See docs/RELEASE-CLIENT.md before the first run.

on:
  workflow_dispatch:
    inputs:
      controller_url:
        description: 'Public HTTPS controller URL, e.g. https://api.example.com'
        required: true
        type: string
      signing_public_key:
        description: 'Base64 Ed25519 public key from the controller signing key'
        required: true
        type: string
      signing_key_id:
        description: 'Signing key id (SIGNING_KEY_ID on the controller)'
        required: true
        default: primary
        type: string
      libbox_ref:
        description: 'Full 40-character reviewed sing-box-libbox commit SHA'
        required: true
        type: string
      app_version:
        description: 'Version name, e.g. 0.1.0'
        required: true
        default: '0.1.0'
        type: string
      app_build_number:
        description: 'Version code; must increase for every release'
        required: true
        default: '1'
        type: string
      release_tag:
        description: 'Optional git tag; when set, attach the APK to a GitHub release'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

env:
  STRICT_CONTROLLER_URL: ${{ inputs.controller_url }}
  STRICT_SIGNING_PUBLIC_KEY: ${{ inputs.signing_public_key }}
  STRICT_SIGNING_KEY_ID: ${{ inputs.signing_key_id }}
  SING_BOX_LIBBOX_REF: ${{ inputs.libbox_ref }}
  APP_VERSION: ${{ inputs.app_version }}
  APP_BUILD_NUMBER: ${{ inputs.app_build_number }}

jobs:
  android:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          case "$STRICT_CONTROLLER_URL" in
            https://*) ;;
            *) echo "controller_url must start with https://" >&2; exit 1 ;;
          esac
          if ! [[ "$SING_BOX_LIBBOX_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "libbox_ref must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Android build dependencies and gomobile
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK" ]; then
            NDK="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK" ]; then
            echo "no Android NDK found on the runner" >&2
            exit 1
          fi
          export ANDROID_NDK_HOME="$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          gomobile init

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build libbox, the APK, and sign it
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./apps/client/tool/build-release-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: strict-proxy-android-${{ inputs.app_version }}-${{ inputs.app_build_number }}
          path: apps/client/build/dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            apps/client/build/dist/*.apk \
            --title "StrictProxy ${{ inputs.app_version }}" \
            --notes "Signed Android build for controller ${{ inputs.controller_url }}."
