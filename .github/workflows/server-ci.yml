name: server-ci

on:
  pull_request:
    paths-ignore:
      - 'apps/client/**'
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - 'apps/client/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  validate:
    name: Validate server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and dry-run pack Gatekeeper npm SDK
        run: |
          npm run build -w @strict-proxy/gatekeeper
          npm pack --dry-run -w @strict-proxy/gatekeeper
      - run: npm run typecheck
      - run: git diff --check
      - name: Run unit tests
        run: npm run test:unit
      - name: Validate Gatekeeper Python SDK (tests, sdist/wheel build, cross-language verify)
        run: |
          python3 -m venv .venv-sdk
          .venv-sdk/bin/pip install --upgrade pip
          .venv-sdk/bin/pip install -e "./sdks/python[dev]"
          .venv-sdk/bin/pytest -v sdks/python/tests
          .venv-sdk/bin/python -m build sdks/python
          .venv-sdk/bin/twine check sdks/python/dist/*
          # Cross-language verification: Node signs payload + entitlement token, Python verifies both.
          node --import tsx --input-type=module -e "
            import { generateEd25519Keypair, loadSigningPrivateKey, signJson } from './packages/types/src/main.ts';
            const keys = generateEd25519Keypair();
            const priv = loadSigningPrivateKey(keys.privateKeyPem);
            const now = Date.now();
            const exp = new Date(now + 600_000).toISOString();
            const ipsPayload = { generatedAt: new Date(now).toISOString(), expiresAt: exp, ips: ['203.0.113.55'] };
            const ipsBody = { ...ipsPayload, keyId: 'interop', signature: signJson(priv, ipsPayload) };
            const claims = { version: 1, keyId: 'interop', sub: 'u1', email: 'interop@example.com', tier: 'pro', status: 'active', currentPeriodEnd: exp, issuedAt: new Date(now).toISOString(), expiresAt: exp };
            const token = 'sp1.' + Buffer.from(JSON.stringify(claims)).toString('base64url') + '.' + Buffer.from(signJson(priv, claims), 'base64').toString('base64url');
            console.log(JSON.stringify({ publicKeyPem: keys.publicKeyPem, ipsBody, token }));
          " | .venv-sdk/bin/python -c "import json, sys; from strict_proxy_gatekeeper import Gatekeeper; data = json.load(sys.stdin); gk = Gatekeeper.init(controller_url='https://controller.test', public_key=data['publicKeyPem'], required_tier='standard', http_get_json=lambda _u, _t: data['ipsBody']); d = gk.auth(ip='203.0.113.55', headers={'x-strict-proxy-entitlement': data['token']}); assert d.allowed and d.user and d.user.email == 'interop@example.com' and d.user.tier == 'pro', d; print('Cross-language Node->Python Ed25519 verification passed!')"
          rm -rf .venv-sdk sdks/python/dist sdks/python/build sdks/python/src/*.egg-info
      - name: Run integration tests
        # Needs a working Docker daemon: the integration suite boots ephemeral
        # Postgres + Redis containers with testcontainers.
        run: npm run test:integration
      - name: Validate server prerequisite script
        run: bash -n scripts/check-server-prereqs.sh scripts/smoke-server.sh scripts/generate-secrets.sh
      - name: Validate production Compose file
        run: |
          cp .env.docker.example .env.docker
          sed -i \
            -e 's/replace-with-a-long-random-password/ci-postgres-password/g' \
            -e 's/replace-with-a-long-random-redis-password/ci-redis-password/g' \
            -e 's/replace-with-openssl-rand-base64-48/ci-jwt-secret-012345678901234567890123/' \
            -e 's/replace-with-a-long-random-secret/ci-webhook-secret-012345678901234567890123/' \
            -e 's#replace-with-ed25519-private-key#ci-ed25519-key#' \
            -e 's#CONTROLLER_DATABASE_URL=.*#CONTROLLER_DATABASE_URL=postgres://strict:ci-postgres-password@postgres:5432/strict_proxy#' \
            -e 's#CONTROLLER_REDIS_URL=.*#CONTROLLER_REDIS_URL=redis://:ci-redis-password@redis:6379#' \
            .env.docker
          docker compose --env-file .env.docker -f docker-compose.production.yml config >/dev/null

      - name: Validate Dokploy Compose files
        run: |
          docker compose --env-file .env.dokploy.example -f docker-compose.dokploy.yml config >/dev/null
          docker compose --env-file .env.dokploy.example -f docker-compose.dokploy-node.yml config >/dev/null

  # The node-agent image is intentionally NOT built here. .github/workflows/
  # node-agent.yml owns it: this job has no platforms matrix, so a second push
  # of the same sha tag replaced the multi-arch index with an amd64-only one and
  # raced on `latest`.
  images:
    name: Build and publish the controller image
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: controller_meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/strict-proxy-controller
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/controller.Dockerfile
          push: true
          tags: ${{ steps.controller_meta.outputs.tags }}
          labels: ${{ steps.controller_meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

  artifacts:
    name: Package server artifacts
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create agent deployment archive
        run: |
          mkdir -p release/node-agent release/packages
          cp -r apps/node-agent/src apps/node-agent/deploy apps/node-agent/package.json release/node-agent/
          cp -r packages/types release/packages/
          cp -r node_modules release/node_modules
          cp package.json package-lock.json tsconfig.base.json release/
          tar -czf strict-proxy-node-agent-${GITHUB_SHA}.tar.gz -C release node-agent packages node_modules package.json package-lock.json tsconfig.base.json
      # Artifact storage is a convenience: exhausting the account quota must not
      # turn a passing build into a failed one. The archive is reproducible from
      # the same commit, and release/package publishing does not depend on it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: strict-proxy-node-agent-${{ github.sha }}
          path: strict-proxy-node-agent-${{ github.sha }}.tar.gz
          if-no-files-found: error
