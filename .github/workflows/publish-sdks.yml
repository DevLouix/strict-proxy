name: publish-sdks

on:
  push:
    tags:
      - 'gatekeeper-v*'
      - 'gatekeeper-js-v*'
      - 'gatekeeper-py-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which SDK(s) to publish'
        type: choice
        default: both
        options:
          - both
          - npm
          - pypi
      dry_run:
        description: 'Build and validate packages without uploading'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Build & publish @strict-proxy/gatekeeper (npm)
    if: >-
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/gatekeeper-v') || startsWith(github.ref, 'refs/tags/gatekeeper-js-v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'npm'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @strict-proxy/gatekeeper
      - run: npm run typecheck -w @strict-proxy/gatekeeper
      - run: npm run test:unit
      - name: Verify npm tarball contents
        run: npm pack --dry-run -w @strict-proxy/gatekeeper
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/gatekeeper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  publish-pypi:
    name: Build & publish strict-proxy-gatekeeper (PyPI)
    if: >-
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/gatekeeper-v') || startsWith(github.ref, 'refs/tags/gatekeeper-py-v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'pypi'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build & test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdks/python[dev]"
      - name: Run Python SDK tests
        run: pytest -v sdks/python/tests
      - name: Build sdist and wheel
        working-directory: sdks/python
        run: |
          python -m build
          twine check dist/*
      - name: Detect PyPI authentication mode
        id: pypi_auth
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "use_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI (Trusted Publishing)
        if: (github.event_name == 'push' || inputs.dry_run == false) && steps.pypi_auth.outputs.use_token == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
      - name: Publish to PyPI (API token)
        if: (github.event_name == 'push' || inputs.dry_run == false) && steps.pypi_auth.outputs.use_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: sdks/python/dist/
