plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.strictproxy.libbox_bridge"
    compileSdk 35

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["libs"]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    // Generated by tool/build-libbox.sh. The plugin remains source-compatible
    // without this file and reports SDK_MISSING at runtime until supplied.
    if (file("libs/libbox.aar").exists()) {
        implementation files("libs/libbox.aar")
    }
}
