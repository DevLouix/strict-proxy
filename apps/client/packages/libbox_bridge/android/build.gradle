plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.strictproxy.libbox_bridge"
    compileSdk 35

    defaultConfig {
        minSdk 21
        // The generated libbox Java is only reachable from native code and
        // reflection, so R8 must be told to keep it (see consumer-rules.pro).
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["libs"]
        }
    }

    testOptions {
        unitTests.all {
            // A JUnit task that discovers no tests also exits successfully, so
            // the CI log has to name every test to prove the rules were checked.
            testLogging {
                events "passed", "failed", "skipped"
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    // The start/stop rules live in plain Kotlin so `:libbox_bridge:testDebugUnitTest`
    // can check them on the JVM; see ServiceLatchTest.
    testImplementation "junit:junit:4.13.2"
    // Generated by tool/unpack-libbox-aar.sh from libs/libbox.aar. A local .aar
    // dependency cannot be packaged inside this library module, so the engine
    // ships as classes.jar (here) plus jni/<abi>/libbox.so (jniLibs above).
    //
    // This is a hard dependency: LibboxVpnService implements the engine's
    // PlatformInterface and CommandServerHandler directly, so a missing or
    // drifted engine has to fail here rather than at runtime inside the VPN
    // process, where a renamed callback silently becomes a null that native
    // code dereferences. `checkLibboxClasses` below turns a missing jar into
    // one sentence instead of a wall of unresolved references.
    implementation files("libs/libbox-classes.jar")
}

// The engine's generated Java is a compile-time requirement (see the dependency
// above). Report a missing or outdated jar as the command that produces it, and
// hook the check to compilation rather than configuration: `flutter build
// --config-only` and the Dart-only test runs configure this module too.
//
// OverrideOptions only exists in the engine that added CommandServer's
// startOrReloadService, which is what this service reloads a tunnel with. An
// artifact without it is a different, older API — the one that used to make
// these calls go through reflection — so it is rejected by name here instead of
// failing later as a missing method inside the VPN process.
def libboxClassesJar = file("libs/libbox-classes.jar")
def checkLibboxClasses = tasks.register("checkLibboxClasses") {
    outputs.upToDateWhen { false }
    doLast {
        def fix = "Build the pinned engine first: apps/client/tool/build-libbox.sh --android-only " +
            "(or run apps/client/tool/unpack-libbox-aar.sh when libbox.aar is already present)"
        if (!libboxClassesJar.exists()) {
            throw new GradleException("libbox engine classes are missing: ${libboxClassesJar}\n${fix}")
        }
        def hasReload = new java.util.zip.ZipFile(libboxClassesJar).withCloseable { zip ->
            zip.getEntry("io/nekohasekai/libbox/OverrideOptions.class") != null
        }
        if (!hasReload) {
            throw new GradleException(
                "libbox engine classes are from an older engine than the pin: " +
                    "${libboxClassesJar} has no CommandServer.startOrReloadService.\n${fix}"
            )
        }
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
        task.dependsOn(checkLibboxClasses)
    }
}
